<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tip Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
  /* Layout: one centered check-style card; bill in, tip choice, tip + total out */
  :root {
    --bg: #eef2f1;
    --card: #ffffff;
    --ink: #17241f;
    --muted: #5b6b65;
    --line: #d5dfdb;
    --accent: #1f7a5c;
    --accent-ink: #ffffff;
    --accent-soft: #e2f1eb;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
    --font-num: "DM Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1614; --card: #18221f; --ink: #e6efeb; --muted: #95a8a0;
      --line: #2b3a35; --accent: #4cc79a; --accent-ink: #0b1a14; --accent-soft: #1c3a2f;
      color-scheme: dark;
    }
  }

  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: grid;
    place-items: center;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .card {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 24px;
    box-sizing: border-box;
    display: grid;
    gap: 24px;
  }
  h1 { font-family: var(--font-display); font-size: 1.6rem; margin: 0; text-wrap: balance; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }

  .label {
    display: block;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .amount-wrap {
    display: flex;
    align-items: center;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 0 14px;
    background: var(--bg);
  }
  .amount-wrap:focus-within { border-color: var(--accent); }
  .amount-wrap span { font-family: var(--font-num); font-size: 1.4rem; color: var(--muted); }
  #amount {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--ink);
    font-family: var(--font-num);
    font-size: 1.6rem;
    padding: 12px 8px;
    outline: none;
  }

  .tips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .tips button {
    font-family: var(--font-num);
    font-size: 1.15rem;
    font-weight: 500;
    padding: 14px 0;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .tips button:hover { border-color: var(--accent); }
  .tips button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tips button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .results {
    border-top: 1.5px dashed var(--line);
    padding-top: 20px;
    display: grid;
    gap: 14px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .row label { font-weight: 500; }
  .row output, .row input {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
    font-size: 1.25rem;
    text-align: right;
  }
  #tipValue {
    width: 9ch;
    border: 0;
    border-radius: 8px;
    padding: 6px 10px;
    background: var(--accent-soft);
    color: var(--ink);
  }
  .total output { font-size: 1.7rem; font-weight: 500; color: var(--accent); }
  .hint { margin: 0; font-size: 0.8rem; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .tips button { transition: none; } }
</style>
</head>
<body>
<main class="card">
  <header>
    <h1>Tip Calculator</h1>
    <p class="sub">Enter the bill, pick a tip.</p>
  </header>

  <div>
    <label class="label" for="amount">Bill amount</label>
    <div class="amount-wrap">
      <span>$</span>
      <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" value="48.60" aria-describedby="hint">
    </div>
  </div>

  <div>
    <span class="label" id="tipLabel">Tip</span>
    <div class="tips" role="group" aria-labelledby="tipLabel">
      <button type="button" id="tip10" data-pct="10" aria-pressed="false">10%</button>
      <button type="button" id="tip15" data-pct="15" aria-pressed="true">15%</button>
      <button type="button" id="tip20" data-pct="20" aria-pressed="false">20%</button>
    </div>
  </div>

  <section class="results" aria-live="polite">
    <div class="row">
      <label for="tipValue">Tip value</label>
      <input id="tipValue" type="text" readonly value="$7.29">
    </div>
    <div class="row total">
      <span>Total</span>
      <output id="total">$55.89</output>
    </div>
    <p class="hint" id="hint">Example bill shown. Type your own amount above.</p>
  </section>
</main>

<script>
  const amountEl = document.getElementById('amount');
  const tipEl = document.getElementById('tipValue');
  const totalEl = document.getElementById('total');
  const buttons = document.querySelectorAll('.tips button');
  const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  let pct = 15;

  function update() {
    const bill = parseFloat(amountEl.value);
    const valid = Number.isFinite(bill) && bill >= 0;
    const tip = valid ? Math.round(bill * pct) / 100 : 0;
    tipEl.value = money.format(tip);
    totalEl.textContent = money.format(valid ? bill + tip : 0);
  }

  buttons.forEach(btn => btn.addEventListener('click', () => {
    pct = Number(btn.dataset.pct);
    buttons.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    update();
  }));
  amountEl.addEventListener('input', update);
  update();
</script>
</body>
</html>
